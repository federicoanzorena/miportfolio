[build]
  command = "npm run build"
  publish = "dist"

# Descubrimiento de agentes: anunciar API (RFC 8288)
[[headers]]
  for = "/"
  [headers.values]
    Link = "<https://binfinito-backend.onrender.com/.well-known/api-catalog>; rel=\"api-catalog\", <https://binfinito-backend.onrender.com/docs>; rel=\"service-doc\""
